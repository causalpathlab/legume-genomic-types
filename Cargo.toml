[package]
name = "legume-genomic-types"
version = "0.6.6"
edition = "2021"
rust-version = "1.91"
license = "MIT"
authors = ["Yongjin Park <ypp@stat.ubc.ca> <yongjin.park@ubc.ca>"]
description = "Shared genomic types and parsers (GFF/GTF, BED, SAM utilities) for legume tools"
repository = "https://github.com/causalpathlab/legume-genomic-types"
readme = "README.md"
keywords = ["genomics", "gff", "bed", "sam", "transcript"]
categories = ["science", "parsing"]
exclude = [
    "**/.claude/**",
    "**/.DS_Store",
]

[lib]
name = "genomic_data"
path = "src/lib.rs"

[features]
default = ["covariate"]
# Per-cell covariates binned as a second axis of batch (`covariate`).
covariate = ["dep:clap", "dep:serde", "dep:serde_json", "dep:nalgebra-sparse"]

[dependencies]
anyhow = "1.0"
dashmap = { version = "6.1.0", features = ["rayon"] }
log = "0.4"
rustc-hash = "2.1"
rayon = "1.10.0"
nalgebra = "0.34"
legume-numeric = { version = ">=0.10.17, <0.11", default-features = false, features = ["matrix"] }
# The covariate module (feature `covariate`): its flags, its recorded model,
# and the count blocks it scores.
clap = { version = "4", features = ["derive"], optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
nalgebra-sparse = { version = "0.11", optional = true }

[dev-dependencies]
tempfile = "3.2"

# Until legume-numeric 0.10.17 is published (removed before this crate is).
[patch.crates-io]
legume-numeric = { git = "https://github.com/causalpathlab/legume-numeric", branch = "main" }
